<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vendemos algunas cosas por mudanza. Retiro por Vicente López, Buenos Aires."
    />
    <title>En venta — Mudanza</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased min-h-screen">
    <header class="max-w-[1600px] mx-auto px-4 pt-6 pb-4 md:pt-8 md:pb-6">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h1 class="text-2xl md:text-3xl font-semibold tracking-tight">
            En venta
          </h1>
          <p class="mt-1 text-neutral-500 text-sm md:text-base">
            Vendemos algunas cosas por mudanza
          </p>
        </div>
        <a
          id="header-whatsapp"
          href="https://wa.me/549116207009?text=Hola!%20Quiero%20consultar%20por%20los%20productos%20en%20venta"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center justify-center gap-2 rounded-full bg-[#25D366] px-4 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-[#1ebe57] hover:shadow-md active:scale-[0.98]"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
            />
          </svg>
          Consultar por WhatsApp
        </a>
      </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-4 pb-10">
      <div
        id="product-grid"
        class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"
        aria-live="polite"
      ></div>
    </main>

    <footer
      class="max-w-[1600px] mx-auto px-4 pb-10 pt-2 text-center text-sm text-neutral-500"
    >
      <p>Retiro por La Lucila, Vicente López, Buenos Aires.</p>
    </footer>

    <dialog
      id="product-dialog"
      class="product-dialog m-auto w-[min(96vw,1100px)] max-h-[92vh] overflow-hidden rounded-2xl bg-white p-0 text-neutral-900 shadow-2xl backdrop:bg-black/50 backdrop:backdrop-blur-sm"
      aria-labelledby="dialog-title"
    >
      <div class="dialog-layout relative flex max-h-[92vh] flex-col md:flex-row">
        <button
          type="button"
          id="dialog-close"
          class="absolute right-3 top-3 z-20 flex h-9 w-9 items-center justify-center rounded-full bg-white/90 text-neutral-700 shadow-sm transition hover:bg-white"
          aria-label="Cerrar"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>

        <div class="gallery-panel relative bg-neutral-100 md:w-[55%] md:shrink-0">
          <div
            id="gallery-track"
            class="gallery-track flex aspect-[3/4] max-h-[50vh] snap-x snap-mandatory overflow-x-auto md:max-h-[92vh] md:aspect-auto md:h-full"
            tabindex="0"
            aria-label="Galería de imágenes"
          ></div>

          <button
            type="button"
            id="gallery-prev"
            class="gallery-nav absolute left-2 top-1/2 z-10 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-neutral-800 shadow-sm transition hover:bg-white"
            aria-label="Imagen anterior"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>
          <button
            type="button"
            id="gallery-next"
            class="gallery-nav absolute right-2 top-1/2 z-10 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-neutral-800 shadow-sm transition hover:bg-white"
            aria-label="Imagen siguiente"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </button>

          <div
            id="gallery-thumbs"
            class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5 px-3 overflow-x-auto"
          ></div>
        </div>

        <div
          class="details-panel flex flex-1 flex-col overflow-y-auto p-5 md:p-7"
        >
          <div class="mb-1">
            <span
              id="dialog-status"
              class="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium"
            ></span>
          </div>
          <h2
            id="dialog-title"
            class="text-2xl font-semibold tracking-tight"
          ></h2>
          <p
            id="dialog-price"
            class="mt-2 text-xl font-medium text-neutral-800"
          ></p>

          <p
            id="dialog-description"
            class="mt-5 text-sm leading-relaxed text-neutral-600"
          ></p>

          <dl class="mt-5 text-sm">
            <div>
              <dt class="text-neutral-500">Estado</dt>
              <dd id="dialog-condition" class="mt-0.5 font-medium"></dd>
            </div>
          </dl>

          <dl class="mt-5 text-sm">
            <dt class="text-neutral-500">Medidas</dt>
            <dd id="dialog-dimensions" class="mt-0.5 font-medium"></dd>
          </dl>


          <a
            id="dialog-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="mt-4 inline-flex text-sm font-medium text-neutral-700 underline underline-offset-4 decoration-neutral-300 transition hover:decoration-neutral-700"
          >
            Ver publicación original
          </a>

          <div class="mt-auto pt-6">
            <a
              id="dialog-whatsapp"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex w-full items-center justify-center gap-2 rounded-full bg-[#25D366] px-5 py-3 text-sm font-medium text-white shadow-sm transition hover:bg-[#1ebe57] hover:shadow-md active:scale-[0.98]"
            >
              <svg
                class="h-4 w-4"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
                />
              </svg>
              Consultar por WhatsApp
            </a>
          </div>
        </div>
      </div>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
